<!-- templates/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account - Aura Optimizer</title>
    <link rel="icon" href="/static/images/icon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { aura: {
                50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#34d399',
                500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b',950:'#022c22'
            } }
        } } }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center bg-[#0a0a0a] p-4 text-white antialiased">
    <div class="w-full max-w-md space-y-8">
        <!-- Logo -->
        <div class="flex justify-center">
            <a href="/" class="flex items-center gap-3">
                <img src="/static/images/icon.ico" alt="Aura" class="w-8 h-8 rounded-lg object-cover" />
                <span class="text-white font-bold text-xl">Aura</span>
            </a>
        </div>

        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-white">Create your account</h1>
            <p class="text-gray-400 text-sm">Start optimizing your PC today</p>
        </div>

        <!-- Form Card -->
        <div class="bg-[#1a1a1a] rounded-2xl border border-gray-800 p-8">
            <div class="space-y-6">
                {{if .DiscordEnabled}}
                <!-- Discord -->
                <a href="/auth/discord/login"
                   class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white h-12 rounded-lg font-medium transition-colors flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                    Continue with Discord
                </a>

                <!-- Divider -->
                <div class="relative">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-[#1a1a1a] px-2 text-gray-500">or</span></div>
                </div>
                {{end}}

                <!-- Form -->
                <form id="register-form" class="space-y-5" novalidate>
                    <div class="space-y-2">
                        <label for="name" class="text-gray-300 text-sm font-medium block">Full Name</label>
                        <input id="name" name="name" type="text" placeholder="John Doe" autocomplete="name"
                            class="w-full h-12 px-3 bg-black border border-gray-800 text-white placeholder:text-gray-500 rounded-lg outline-none focus:border-gray-600 transition-colors" />
                        <p id="name-error" class="text-xs text-red-500 hidden"></p>
                    </div>

                    <div class="space-y-2">
                        <label for="email" class="text-gray-300 text-sm font-medium block">Email</label>
                        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email"
                            class="w-full h-12 px-3 bg-black border border-gray-800 text-white placeholder:text-gray-500 rounded-lg outline-none focus:border-gray-600 transition-colors" />
                        <p id="email-error" class="text-xs text-red-500 hidden"></p>
                    </div>

                    <div class="space-y-2">
                        <label for="password" class="text-gray-300 text-sm font-medium block">Password</label>
                        <div class="relative">
                            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="new-password"
                                class="w-full h-12 px-3 pr-10 bg-black border border-gray-800 text-white placeholder:text-gray-500 rounded-lg outline-none focus:border-gray-600 transition-colors" />
                            <button type="button" id="pwd-toggle" aria-label="Show password"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                                <svg id="eye-open" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg id="eye-closed" class="h-4 w-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </button>
                        </div>
                        <p id="password-error" class="text-xs text-red-500 hidden"></p>
                    </div>

                    <button type="submit" id="submit-btn"
                        class="w-full bg-emerald-500 hover:bg-emerald-600 text-white h-12 rounded-lg font-medium transition-colors flex items-center justify-center group disabled:opacity-60">
                        <span id="submit-label">Create Account</span>
                        <svg class="ml-2 h-4 w-4 group-hover:translate-x-1 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </form>

                <!-- Footer -->
                <div class="text-center pt-2">
                    <p class="text-gray-400 text-sm">
                        Already have an account?
                        <a href="/login" class="text-emerald-500 hover:text-emerald-400 font-medium transition-colors">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const nameEl = document.getElementById('name');
        const emailEl = document.getElementById('email');
        const pwdEl = document.getElementById('password');
        const nameErr = document.getElementById('name-error');
        const emailErr = document.getElementById('email-error');
        const pwdErr = document.getElementById('password-error');
        const submitBtn = document.getElementById('submit-btn');
        const submitLabel = document.getElementById('submit-label');

        // Show/hide password
        const toggle = document.getElementById('pwd-toggle');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');
        toggle.addEventListener('click', function () {
            const reveal = pwdEl.type === 'password';
            pwdEl.type = reveal ? 'text' : 'password';
            eyeOpen.classList.toggle('hidden', reveal);
            eyeClosed.classList.toggle('hidden', !reveal);
            toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
        });

        function setError(input, errEl, msg) {
            errEl.textContent = msg || '';
            errEl.classList.toggle('hidden', !msg);
            input.classList.toggle('border-red-500', !!msg);
            input.classList.toggle('border-gray-800', !msg);
        }
        nameEl.addEventListener('input', function () { setError(nameEl, nameErr, ''); });
        emailEl.addEventListener('input', function () { setError(emailEl, emailErr, ''); });
        pwdEl.addEventListener('input', function () { setError(pwdEl, pwdErr, ''); });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            let ok = true;
            const name = nameEl.value.trim();
            const email = emailEl.value.trim();
            if (!name) { setError(nameEl, nameErr, 'Name is required'); ok = false; }
            if (!email) { setError(emailEl, emailErr, 'Email is required'); ok = false; }
            else if (!/\S+@\S+\.\S+/.test(email)) { setError(emailEl, emailErr, 'Email is invalid'); ok = false; }
            if (!pwdEl.value) { setError(pwdEl, pwdErr, 'Password is required'); ok = false; }
            if (!ok) return;

            submitBtn.disabled = true;
            submitLabel.textContent = 'Creating…';
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: pwdEl.value }),
                });
                if (!res.ok) {
                    const data = await res.json().catch(function () { return {}; });
                    throw new Error(data.error || 'Could not create your account.');
                }
                window.location.href = '/';
            } catch (err) {
                submitBtn.disabled = false;
                submitLabel.textContent = 'Create Account';
                setError(emailEl, emailErr, err.message);
            }
        });
    </script>
</body>
</html>
