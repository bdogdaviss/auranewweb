<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Aura Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
        }
        .text-gradient {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
    </style>
</head>
<body class="text-white flex items-center justify-center p-4">
    <!-- Background -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-aura-950/50 via-black to-black -z-10"></div>
    
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3 mb-8">
                <div class="w-12 h-12 bg-aura-800 rounded-lg flex items-center justify-center font-bold text-2xl">A</div>
                <span class="font-bold text-2xl">Aura</span>
            </a>
            <h1 class="text-3xl font-bold mb-2">Welcome back</h1>
            <p class="text-gray-400">Sign in to your account</p>
        </div>
        
        <form id="login-form" class="bg-white/5 border border-white/10 rounded-2xl p-8 space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                <input type="email" name="email" required 
                       class="w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl focus:border-aura-500 transition outline-none"
                       placeholder="you@example.com">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl focus:border-aura-500 transition outline-none"
                       placeholder="••••••••">
            </div>
            
            <button type="submit" id="submit-btn" class="w-full bg-white text-black hover:bg-aura-400 py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
            
            <p class="text-center text-sm text-gray-400">
                Don't have an account? 
                <a href="/register" class="text-aura-400 hover:text-aura-300 font-medium">Get Started</a>
            </p>
        </form>
    </div>
    
    <script>
        lucide.createIcons();
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const form = e.target;
            
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>';
            btn.disabled = true;
            lucide.createIcons();
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: form.email.value,
                        password: form.password.value
                    })
                });
                
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    throw new Error('Login failed');
                }
            } catch (err) {
                btn.innerHTML = '<span>Sign In</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                btn.disabled = false;
                lucide.createIcons();
                alert('Invalid credentials');
            }
        });
    </script>
</body>
</html>
