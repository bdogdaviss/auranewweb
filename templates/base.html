<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}} - Aura Optimizer</title>
    <link rel="icon" href="/static/images/icon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        aura: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 5px #10b981, 0 0 10px #10b981' },
                            '100%': { boxShadow: '0 0 20px #10b981, 0 0 30px #10b981' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .hero-glow { position: relative; }
        .hero-glow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            animation: pulse-slow 4s ease-in-out infinite;
            pointer-events: none;
        }
        .step-line { position: relative; }
        .step-line::after {
            content: '';
            position: absolute;
            left: 24px;
            top: 48px;
            width: 2px;
            height: calc(100% - 48px);
            background: linear-gradient(to bottom, #10b981, transparent);
        }
        .step-line:last-child::after { display: none; }
    </style>
    {{template "head" .}}
</head>
<body class="bg-gray-950 text-white antialiased">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="/" class="flex items-center gap-2">
                        <img src="/static/images/icon.ico" alt="Aura" class="w-8 h-8 rounded-lg object-cover" />
                        <span class="font-bold text-xl tracking-tight">Aura</span>
                    </a>
                    <div class="hidden md:flex items-center gap-6">
                        <a href="/" class="text-sm text-gray-300 hover:text-white transition">Home</a>
                        <a href="/features" class="text-sm text-gray-300 hover:text-white transition">Features</a>
                        <a href="/pricing" class="text-sm text-gray-300 hover:text-white transition">Pricing</a>
                        <a href="/download" class="text-sm text-gray-300 hover:text-white transition">Download</a>
                        <a href="/about" class="text-sm text-gray-300 hover:text-white transition">About</a>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <button onclick="toggleCart()" class="relative p-2 text-gray-300 hover:text-white transition">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                        <span id="cart-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-aura-500 rounded-full text-xs flex items-center justify-center hidden">0</span>
                    </button>
                    
                    {{if .User}}
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-300 hidden sm:block">{{.User.Name}}</span>
                        <img src="{{.User.Avatar}}" alt="Avatar" class="w-8 h-8 rounded-full border border-gray-700">
                        <a href="/logout" class="text-sm text-gray-400 hover:text-white transition">Logout</a>
                    </div>
                    {{else}}
                    <a href="/login" class="text-sm text-gray-300 hover:text-white transition">Log in</a>
                    <a href="/register" class="bg-aura-600 hover:bg-aura-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Sign up</a>
                    {{end}}
                </div>
            </div>
        </div>
    </nav>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-gray-900 border-l border-gray-800 transform translate-x-full transition-transform duration-300 z-50">
        <div class="p-6 h-full flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Your Cart</h2>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-4">
                <!-- Cart items injected here -->
            </div>
            <div class="border-t border-gray-800 pt-4 mt-4">
                <div class="flex justify-between mb-4">
                    <span class="text-gray-400">Total</span>
                    <span id="cart-total" class="text-xl font-bold">$0.00</span>
                </div>
                <button onclick="checkout()" id="checkout-btn" class="w-full bg-aura-600 hover:bg-aura-700 text-white py-3 rounded-lg font-medium transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Checkout
                </button>
            </div>
        </div>
    </div>
    <div id="cart-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden" onclick="toggleCart()"></div>

    <!-- Main Content -->
    <main class="pt-16">
        {{template "content" .}}
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <!-- Aura Chat Bot -->
    <div id="aura-chat-bubble" onclick="auraChat.toggle()" class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-2xl flex items-center justify-center cursor-pointer transition-all duration-200" style="background:#2a2a2a; border:1px solid #333;">
        <svg id="chat-icon-open" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <svg id="chat-icon-close" class="hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e5e5e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>

    <div id="aura-chat-window" class="fixed bottom-24 right-6 z-50 w-80 sm:w-96 rounded-2xl overflow-hidden transform scale-0 origin-bottom-right transition-transform duration-200" style="background:#1a1a1a; border:1px solid #2a2a2a;">
        <!-- Header -->
        <div class="px-5 py-4 flex items-center gap-3" style="border-bottom:1px solid #2a2a2a;">
            <img src="/static/images/icon.ico" alt="Aura" class="w-8 h-8 rounded-lg" />
            <div class="flex-1">
                <p class="font-medium text-sm text-white">Aura Support</p>
                <p class="text-xs text-gray-500 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full inline-block" style="background:#4ade80;"></span> Online</p>
            </div>
            <button onclick="auraChat.toggle()" class="text-gray-500 hover:text-gray-300 transition p-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- Messages -->
        <div id="aura-chat-messages" class="px-4 py-4 space-y-3 overflow-y-auto" style="height: 360px; scrollbar-width: thin; scrollbar-color: #333 transparent;">
        </div>

        <!-- Input -->
        <div class="px-4 py-3" style="border-top:1px solid #2a2a2a;">
            <div class="flex items-center gap-2">
                <input id="aura-chat-input" type="text" placeholder="Type a question..." class="flex-1 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none transition" style="background:#222; border:1px solid #333;" onkeydown="if(event.key==='Enter')auraChat.sendUserMessage()" />
                <button onclick="auraChat.sendUserMessage()" class="p-2.5 rounded-lg transition" style="background:#333;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
    var auraChat = (function() {
        var isOpen = false;
        var hasGreeted = false;

        var quickReplies = [
            { label: 'How does Aura work?', key: 'how_works' },
            { label: 'Which plan is right for me?', key: 'which_plan' },
            { label: 'Is Aura safe to use?', key: 'safe' },
            { label: 'System requirements?', key: 'requirements' },
            { label: 'Do you offer refunds?', key: 'refund' },
            { label: 'I need help with setup', key: 'setup' }
        ];

        var responses = {
            how_works: {
                text: "Aura scans your system and applies optimizations tailored to your hardware. It cleans background processes, tunes network settings, and adjusts Windows configs to prioritize gaming performance. One click and you're done!",
                followUp: [
                    { label: 'What kind of FPS boost?', key: 'fps_boost' },
                    { label: 'Does it change game files?', key: 'game_files' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            which_plan: {
                text: "We have 3 plans:\n\n<b>Free</b> — Basic optimization, great for trying it out.\n\n<b>Lifetime Pro ($15)</b> — Full AI optimization, network tuning, priority support, and lifetime updates. Most popular!\n\n<b>Team License ($149.99)</b> — Pro features for up to 10 PCs. Perfect for teams and gaming houses.",
                followUp: [
                    { label: 'What does Pro include?', key: 'pro_features' },
                    { label: 'Take me to pricing', key: 'go_pricing' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            safe: {
                text: "100% safe. Aura only adjusts Windows settings and network configs — it never touches your game files or installs anything suspicious. All changes can be reversed. We're trusted by 50,000+ gamers and partnered with competitive Fortnite players.",
                followUp: [
                    { label: 'Will I get banned?', key: 'banned' },
                    { label: 'Is it a virus?', key: 'virus' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            requirements: {
                text: "Aura works on:\n\n• <b>Windows 10</b> or <b>Windows 11</b>\n• 4GB RAM minimum\n• 100MB free disk space\n• Internet connection for activation\n\nNo special hardware required — works on laptops and desktops.",
                followUp: [
                    { label: 'Does it work on Mac?', key: 'mac' },
                    { label: 'Download now', key: 'go_download' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            refund: {
                text: "Yes! We offer a <b>30-day money-back guarantee</b>. If you're not satisfied with Aura Pro, reach out on our Discord and we'll process your refund — no questions asked.",
                followUp: [
                    { label: 'Join Discord', key: 'go_discord' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            setup: {
                text: "Getting started is easy:\n\n<b>1.</b> Download Aura from our download page\n<b>2.</b> Run the installer (aura-setup.exe)\n<b>3.</b> Open Aura and click Optimize\n<b>4.</b> That's it — your PC is now optimized\n\nIf you run into issues, our Discord community can help.",
                followUp: [
                    { label: 'Download now', key: 'go_download' },
                    { label: 'Join Discord', key: 'go_discord' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            fps_boost: {
                text: "Results vary by system, but our users report an <b>average +47% FPS increase</b>. Some users on lower-end systems have seen even bigger gains — going from 80fps to 200+ fps after optimization.",
                followUp: [
                    { label: 'Try it free', key: 'go_download' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            game_files: {
                text: "No, never. Aura only optimizes <b>Windows system settings</b>, background processes, and network configurations. It does not modify, inject into, or interact with any game files.",
                followUp: [
                    { label: 'Is it safe?', key: 'safe' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            pro_features: {
                text: "Aura Pro includes everything in Free, plus:\n\n• <b>AI-powered optimization</b> tailored to your hardware\n• <b>Network optimization</b> (reduce ping)\n• <b>Advanced memory management</b>\n• <b>Priority support</b> on Discord\n• <b>Lifetime updates</b> — pay once, use forever",
                followUp: [
                    { label: 'Get Pro now', key: 'go_pricing' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            banned: {
                text: "No. Aura does <b>not</b> interact with any game process or files. It only adjusts Windows-level settings. It's no different from manually tweaking your PC — anti-cheats have zero reason to flag it.",
                followUp: [
                    { label: 'How does it work?', key: 'how_works' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            virus: {
                text: "Aura is <b>not a virus</b>. Some antivirus programs flag optimization tools because they modify system settings — this is a false positive. You can verify our safety through our 50,000+ user community and partnered pro players.",
                followUp: [
                    { label: 'Join Discord', key: 'go_discord' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            mac: {
                text: "Currently Aura is <b>Windows only</b> (Windows 10 & 11). We don't have plans for Mac at this time since our core audience is PC gamers.",
                followUp: [
                    { label: 'System requirements', key: 'requirements' },
                    { label: 'Back to menu', key: 'menu' }
                ]
            },
            go_pricing: { text: "Taking you to our pricing page!", action: function() { window.location.href = '/pricing'; } },
            go_download: { text: "Taking you to the download page!", action: function() { window.location.href = '/download'; } },
            go_discord: { text: "Opening our Discord server!", action: function() { window.open('https://discord.com/invite/4TBUw4nBFd', '_blank'); } },
            menu: { text: null }
        };

        var keywords = [
            { patterns: ['price', 'cost', 'how much', 'pay', 'pricing', 'plan'], key: 'which_plan' },
            { patterns: ['how', 'work', 'what does', 'explain'], key: 'how_works' },
            { patterns: ['safe', 'virus', 'malware', 'trust', 'legit', 'scam'], key: 'safe' },
            { patterns: ['ban', 'banned', 'anti-cheat', 'anticheat', 'flagged'], key: 'banned' },
            { patterns: ['fps', 'boost', 'performance', 'improve', 'increase', 'speed'], key: 'fps_boost' },
            { patterns: ['download', 'install', 'get it', 'where'], key: 'setup' },
            { patterns: ['refund', 'money back', 'return', 'cancel'], key: 'refund' },
            { patterns: ['require', 'specs', 'windows', 'system', 'laptop', 'pc'], key: 'requirements' },
            { patterns: ['pro', 'premium', 'upgrade', 'lifetime', 'features'], key: 'pro_features' },
            { patterns: ['mac', 'linux', 'apple', 'macbook'], key: 'mac' },
            { patterns: ['discord', 'support', 'help', 'contact', 'talk'], key: 'go_discord' },
            { patterns: ['setup', 'install', 'start', 'begin', 'guide'], key: 'setup' },
            { patterns: ['game files', 'modify', 'inject', 'touch'], key: 'game_files' },
            { patterns: ['hi', 'hello', 'hey', 'sup', 'yo', 'whats up'], key: '_greeting' }
        ];

        function toggle() {
            isOpen = !isOpen;
            var win = document.getElementById('aura-chat-window');
            var iconOpen = document.getElementById('chat-icon-open');
            var iconClose = document.getElementById('chat-icon-close');

            if (isOpen) {
                win.style.transform = 'scale(1)';
                iconOpen.classList.add('hidden');
                iconClose.classList.remove('hidden');
                if (!hasGreeted) { greet(); hasGreeted = true; }
                document.getElementById('aura-chat-input').focus();
            } else {
                win.style.transform = 'scale(0)';
                iconOpen.classList.remove('hidden');
                iconClose.classList.add('hidden');
            }
        }

        function greet() {
            addBotMessage("Hey! I'm Aura's assistant. How can I help you today?");
            setTimeout(function() { showQuickReplies(quickReplies); }, 400);
        }

        function addBotMessage(html) {
            var container = document.getElementById('aura-chat-messages');
            var wrapper = document.createElement('div');
            wrapper.className = 'flex gap-2.5 items-start';
            wrapper.innerHTML = '<div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5" style="background:#222;"><img src="/static/images/icon.ico" class="w-4 h-4 rounded-sm" /></div>' +
                '<div style="background:#222; border-radius:12px; border-top-left-radius:4px; padding:10px 14px; max-width:80%; font-size:13px; line-height:1.5; color:#d4d4d4;">' + html.replace(/\n/g, '<br>') + '</div>';
            container.appendChild(wrapper);
            scrollToBottom();
        }

        function addUserMessage(text) {
            var container = document.getElementById('aura-chat-messages');
            var wrapper = document.createElement('div');
            wrapper.style.cssText = 'display:flex; justify-content:flex-end;';
            wrapper.innerHTML = '<div style="background:#2a2a2a; border-radius:12px; border-top-right-radius:4px; padding:10px 14px; max-width:80%; font-size:13px; color:#e5e5e5;">' + escapeHtml(text) + '</div>';
            container.appendChild(wrapper);
            scrollToBottom();
        }

        function showQuickReplies(options) {
            var container = document.getElementById('aura-chat-messages');
            var wrapper = document.createElement('div');
            wrapper.className = 'aura-quick-replies';
            wrapper.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px; padding-left:36px;';
            options.forEach(function(opt) {
                var btn = document.createElement('button');
                btn.style.cssText = 'font-size:12px; padding:6px 12px; border-radius:8px; background:#222; border:1px solid #333; color:#a3a3a3; cursor:pointer; transition:all 0.15s;';
                btn.textContent = opt.label;
                btn.onmouseenter = function() { this.style.background = '#2a2a2a'; this.style.color = '#e5e5e5'; };
                btn.onmouseleave = function() { this.style.background = '#222'; this.style.color = '#a3a3a3'; };
                btn.onclick = function() { handleQuickReply(opt.key, opt.label); };
                wrapper.appendChild(btn);
            });
            container.appendChild(wrapper);
            scrollToBottom();
        }

        function removeQuickReplies() {
            var all = document.querySelectorAll('.aura-quick-replies');
            all.forEach(function(el) { el.remove(); });
        }

        function handleQuickReply(key, label) {
            removeQuickReplies();
            addUserMessage(label);

            if (key === 'menu') {
                setTimeout(function() {
                    addBotMessage("What else can I help you with?");
                    setTimeout(function() { showQuickReplies(quickReplies); }, 300);
                }, 500);
                return;
            }

            var resp = responses[key];
            if (!resp) return;

            setTimeout(function() {
                showTyping();
                setTimeout(function() {
                    removeTyping();
                    if (resp.text) addBotMessage(resp.text);
                    if (resp.action) { setTimeout(resp.action, 800); }
                    if (resp.followUp) {
                        setTimeout(function() { showQuickReplies(resp.followUp); }, 300);
                    }
                }, 800 + Math.random() * 600);
            }, 300);
        }

        function sendUserMessage() {
            var input = document.getElementById('aura-chat-input');
            var text = input.value.trim();
            if (!text) return;
            input.value = '';
            removeQuickReplies();
            addUserMessage(text);

            var lower = text.toLowerCase();
            var matchedKey = null;

            for (var i = 0; i < keywords.length; i++) {
                for (var j = 0; j < keywords[i].patterns.length; j++) {
                    if (lower.indexOf(keywords[i].patterns[j]) !== -1) {
                        matchedKey = keywords[i].key;
                        break;
                    }
                }
                if (matchedKey) break;
            }

            setTimeout(function() {
                showTyping();
                setTimeout(function() {
                    removeTyping();
                    if (matchedKey === '_greeting') {
                        addBotMessage("Hey there! What can I help you with?");
                        setTimeout(function() { showQuickReplies(quickReplies); }, 300);
                    } else if (matchedKey && responses[matchedKey]) {
                        var resp = responses[matchedKey];
                        if (resp.text) addBotMessage(resp.text);
                        if (resp.action) { setTimeout(resp.action, 800); }
                        if (resp.followUp) {
                            setTimeout(function() { showQuickReplies(resp.followUp); }, 300);
                        }
                    } else {
                        addBotMessage("I'm not sure about that one. Here are some things I can help with:");
                        setTimeout(function() { showQuickReplies(quickReplies); }, 300);
                    }
                }, 800 + Math.random() * 600);
            }, 300);
        }

        function showTyping() {
            var container = document.getElementById('aura-chat-messages');
            var wrapper = document.createElement('div');
            wrapper.id = 'aura-typing';
            wrapper.className = 'flex gap-2.5 items-start';
            wrapper.innerHTML = '<div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5" style="background:#222;"><img src="/static/images/icon.ico" class="w-4 h-4 rounded-sm" /></div>' +
                '<div style="background:#222; border-radius:12px; border-top-left-radius:4px; padding:12px 16px; display:flex; gap:4px;">' +
                '<span style="width:6px;height:6px;background:#555;border-radius:50%;animation:auraDot 1.2s infinite 0s;"></span>' +
                '<span style="width:6px;height:6px;background:#555;border-radius:50%;animation:auraDot 1.2s infinite 0.2s;"></span>' +
                '<span style="width:6px;height:6px;background:#555;border-radius:50%;animation:auraDot 1.2s infinite 0.4s;"></span></div>';
            container.appendChild(wrapper);
            scrollToBottom();
        }

        function removeTyping() {
            var el = document.getElementById('aura-typing');
            if (el) el.remove();
        }

        function scrollToBottom() {
            var container = document.getElementById('aura-chat-messages');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(t) {
            var d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        return { toggle: toggle, sendUserMessage: sendUserMessage };
    })();
    </script>
    <style>
        @keyframes auraDot {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-3px); }
        }
    </style>

    <script>
        lucide.createIcons();

        // Cart functionality
        let cart = { items: [], total: 0 };
        
        async function loadCart() {
            try {
                const res = await fetch('/api/cart');
                if (res.ok) {
                    cart = await res.json();
                    updateCartUI();
                }
            } catch (e) { console.error('Failed to load cart'); }
        }
        
        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const itemsContainer = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            const count = cart.items.reduce((sum, item) => sum + item.quantity, 0);
            badge.textContent = count;
            badge.classList.toggle('hidden', count === 0);
            
            if (cart.items.length === 0) {
                itemsContainer.innerHTML = '<p class="text-gray-500 text-center py-8">Your cart is empty</p>';
                checkoutBtn.disabled = true;
            } else {
                itemsContainer.innerHTML = cart.items.map(item => `
                    <div class="flex justify-between items-center bg-gray-800 p-4 rounded-lg">
                        <div>
                            <h3 class="font-medium">${item.product.name}</h3>
                            <p class="text-sm text-gray-400">Qty: ${item.quantity}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold">$${(item.product.price * item.quantity).toFixed(2)}</span>
                            <button onclick="removeFromCart('${item.product_id}')" class="text-red-400 hover:text-red-300">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
                checkoutBtn.disabled = false;
            }
            
            totalEl.textContent = '$' + cart.total.toFixed(2);
        }
        
        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            const isOpen = !sidebar.classList.contains('translate-x-full');
            
            if (isOpen) {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                loadCart();
            }
        }
        
        async function addToCart(productId) {
            try {
                const res = await fetch('/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId, quantity: 1 })
                });
                
                if (res.ok) {
                    cart = await res.json();
                    updateCartUI();
                    showToast('Added to cart!', 'success');
                    toggleCart();
                } else if (res.status === 401) {
                    window.location.href = '/login';
                }
            } catch (e) { showToast('Failed to add to cart', 'error'); }
        }
        
        async function removeFromCart(productId) {
            try {
                const res = await fetch(`/api/cart/remove?product_id=${productId}`, { method: 'DELETE' });
                if (res.ok) {
                    cart = await res.json();
                    updateCartUI();
                }
            } catch (e) { console.error('Failed to remove item'); }
        }
        
        function checkout() {
            window.open('https://www.paypal.com/ncp/payment/79PXBKPV3Z27C', '_blank');
        }
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 ${
                type === 'success' ? 'bg-aura-600' : 'bg-red-600'
            } text-white flex items-center gap-2`;
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check' : 'alert-circle'}" class="w-5 h-5"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // Initial load
        loadCart();
    </script>
    {{template "scripts" .}}
</body>
</html>
