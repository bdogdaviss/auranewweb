name: Go CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: go mod tidy drift
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: validate mermaid diagram in README
        run: |
          # Extract the first ```mermaid ... ``` block from README.md and verify mmdc can parse it.
          # Parse-only: render to a throwaway path; non-zero exit = syntax error.
          awk '/^```mermaid$/{flag=1;next} /^```$/{flag=0} flag' README.md > /tmp/diagram.mmd
          test -s /tmp/diagram.mmd || { echo "::error::No mermaid block found in README.md"; exit 1; }
          npx -y --package=@mermaid-js/mermaid-cli mmdc -i /tmp/diagram.mmd -o /tmp/diagram.svg -b transparent
