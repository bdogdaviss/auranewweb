# fly.toml app configuration for auranewweb.
# See https://fly.io/docs/reference/configuration/ for full schema.

app = 'auranewweb'
primary_region = 'dfw'

[build]
  [build.args]
    GO_VERSION = '1.25.0'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Persistent volume for the SQLite database (license keys + processed events).
# Without this, every fly deploy reset wipes the DB and customers lose access.
# Create with: fly volumes create data --region dfw --size 1
[[mounts]]
  source = 'data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
